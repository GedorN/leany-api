version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: nest_mvc_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-nestdb}
      POSTGRES_USER: ${DB_USERNAME:-nest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nestpassword}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest_mvc_api
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      # Override host to point to the db service name
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - "3000:3000"

volumes:
  db_data:
